<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#02070b">
  <title>JARVIS | SERINA</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02070b;
      color: #e9fbff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 50% 31%, rgba(19, 119, 151, .30) 0, rgba(5, 28, 41, .17) 31%, rgba(2, 7, 11, 0) 59%),
        linear-gradient(180deg, #081722 0%, #02070b 100%);
    }

    button, input {
      font-family: inherit;
    }

    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
    }

    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .065;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(112, 230, 255, .18) 4px
      );
    }

    .header {
      flex: 0 0 auto;
      min-height: 51px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-main {
      font-size: 27px;
      font-weight: 300;
      letter-spacing: 7px;
      color: #a9f1ff;
      text-shadow: 0 0 15px rgba(71, 218, 251, .55);
    }

    .brand-sub {
      margin-top: 6px;
      font-size: 9px;
      letter-spacing: 2.3px;
      color: #678995;
    }

    .header-right {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #55e5ff;
      box-shadow: 0 0 10px rgba(85,229,255,.85);
    }

    .online-text {
      font-size: 9px;
      letter-spacing: 1.4px;
      color: #688b97;
    }

    .settings-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(99, 221, 249, .18);
      background: rgba(6, 29, 40, .72);
      color: #87dce9;
      font-size: 17px;
    }

    .stats {
      flex: 0 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 7px;
      margin-top: 9px;
    }

    .stat {
      min-height: 54px;
      border-radius: 13px;
      border: 1px solid rgba(90, 214, 245, .14);
      background: rgba(7, 31, 43, .57);
      padding: 8px 10px;
    }

    .stat-label {
      font-size: 8px;
      letter-spacing: 1.2px;
      color: #668791;
    }

    .stat-value {
      margin-top: 4px;
      font-size: 19px;
      font-weight: 600;
      color: #e1fbff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 7px 0;
    }

    .reactor {
      width: 57vw;
      height: 57vw;
      max-width: 238px;
      max-height: 238px;
      min-width: 170px;
      min-height: 170px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(101, 228, 255, .38);
      box-shadow:
        inset 0 0 32px rgba(40, 181, 216, .11),
        0 0 37px rgba(39, 193, 230, .12);
    }

    .reactor:before,
    .reactor:after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(105, 231, 255, .16);
    }

    .reactor:before { inset: 12%; }
    .reactor:after { inset: 25%; }

    .reactor-core {
      z-index: 2;
      width: 24%;
      height: 24%;
      border-radius: 50%;
      background: radial-gradient(circle, #ebfeff 0, #70eaff 20%, #0e6c87 50%, rgba(4, 28, 38, .15) 76%);
      box-shadow:
        0 0 16px rgba(108, 238, 255, .9),
        0 0 52px rgba(65, 207, 240, .34);
    }

    .reactor.listening .reactor-core {
      animation: listenPulse .72s infinite alternate;
    }

    .reactor.processing .reactor-core {
      animation: processingPulse .6s infinite ease-in-out;
    }

    .reactor.complete .reactor-core {
      background: radial-gradient(circle, #effff6 0, #83f5b7 25%, #168957 57%, rgba(4, 28, 38, .15) 77%);
      box-shadow:
        0 0 17px rgba(129, 255, 188, .95),
        0 0 53px rgba(54, 233, 140, .43);
    }

    .reactor.error .reactor-core {
      background: radial-gradient(circle, #fff 0, #ff8989 24%, #9a2929 58%, rgba(4, 28, 38, .15) 77%);
      box-shadow:
        0 0 17px rgba(255, 127, 127, .95),
        0 0 52px rgba(255, 69, 69, .36);
    }

    @keyframes listenPulse {
      from { transform: scale(.95); }
      to { transform: scale(1.38); box-shadow: 0 0 27px rgba(108,238,255,1), 0 0 78px rgba(65,207,240,.58); }
    }

    @keyframes processingPulse {
      0%, 100% { transform: scale(.86); opacity: .72; }
      50% { transform: scale(1.23); opacity: 1; }
    }

    .state-title {
      margin-top: 17px;
      font-size: 22px;
      letter-spacing: 4px;
      color: #a7effb;
      text-align: center;
    }

    .state-sub {
      min-height: 38px;
      max-width: 94%;
      margin-top: 7px;
      text-align: center;
      color: #75939f;
      font-size: 13px;
      line-height: 1.5;
    }

    .message-box {
      width: 100%;
      max-height: 132px;
      overflow-y: auto;
      display: none;
      margin-top: 7px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(90, 216, 247, .12);
      background: rgba(5, 25, 35, .48);
      color: #d9f7fc;
      font-size: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .footer {
      flex: 0 0 auto;
      padding-bottom: 7px;
    }

    .clap-status {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
      color: #607d88;
      font-size: 10px;
      letter-spacing: 1.55px;
    }

    .clap-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #49dcf7;
      box-shadow: 0 0 9px rgba(73,220,247,.72);
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    .input-row input {
      flex: 1;
      min-width: 0;
      height: 50px;
      border-radius: 14px;
      border: 1px solid rgba(98, 220, 250, .18);
      outline: none;
      background: rgba(6, 27, 38, .87);
      color: white;
      padding: 0 14px;
      font-size: 16px;
    }

    .input-row input:focus {
      border-color: rgba(98, 220, 250, .56);
    }

    .icon-btn {
      flex: 0 0 53px;
      height: 50px;
      border-radius: 14px;
      border: 1px solid rgba(93, 218, 246, .20);
      background: rgba(8, 48, 63, .9);
      color: #e8ffff;
      font-size: 19px;
    }

    .send-btn {
      border: 0;
      background: linear-gradient(145deg, #1682a2, #095169);
    }

    .start-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background:
        radial-gradient(circle at center, rgba(10, 74, 96, .40), rgba(2, 7, 11, .97) 64%);
    }

    .start-panel {
      width: 92vw;
      max-width: 430px;
      border-radius: 22px;
      border: 1px solid rgba(97, 226, 255, .30);
      background: rgba(5, 25, 35, .94);
      box-shadow: 0 0 46px rgba(44, 194, 230, .14);
      padding: 29px 20px;
      text-align: center;
    }

    .start-title {
      font-size: 29px;
      font-weight: 300;
      letter-spacing: 7px;
      color: #a7f0fb;
    }

    .start-text {
      margin: 17px auto 15px;
      max-width: 330px;
      color: #7d9aa5;
      font-size: 13px;
      line-height: 1.7;
    }

    .pair-input {
      width: 100%;
      height: 48px;
      margin-bottom: 10px;
      border-radius: 13px;
      border: 1px solid rgba(97,226,255,.22);
      outline: none;
      background: rgba(2,16,23,.78);
      color: #eaffff;
      padding: 0 13px;
      font-size: 14px;
    }

    .pair-hint {
      min-height: 18px;
      margin-bottom: 10px;
      color: #6f919c;
      font-size: 11px;
    }

    .start-button {
      width: 100%;
      height: 59px;
      border-radius: 16px;
      border: 1px solid rgba(104, 233, 255, .42);
      background: linear-gradient(145deg, #1481a1, #0a4c63);
      color: white;
      letter-spacing: 2px;
      font-size: 17px;
    }

    .settings-panel {
      position: fixed;
      z-index: 30;
      top: 0;
      right: -300px;
      width: 288px;
      height: 100%;
      padding: 70px 18px 20px;
      background: rgba(4, 20, 28, .985);
      border-left: 1px solid rgba(91, 219, 248, .17);
      transition: right .18s ease;
    }

    .settings-panel.open { right: 0; }

    .settings-title {
      color: #9eefff;
      font-size: 13px;
      letter-spacing: 1.8px;
      margin-bottom: 20px;
    }

    .setting-block {
      margin-bottom: 19px;
    }

    .setting-line {
      display: flex;
      justify-content: space-between;
      color: #77949f;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .setting-block input[type="range"] {
      width: 100%;
    }

    .setting-button {
      width: 100%;
      height: 44px;
      margin-top: 7px;
      border-radius: 12px;
      border: 1px solid rgba(96, 221, 250, .20);
      background: rgba(7, 38, 50, .82);
      color: #a8eef9;
    }

    .pair-status {
      color: #7a9aa6;
      font-size: 11px;
      line-height: 1.5;
    }

    #gasTransportFrame {
      display: none;
      width: 1px;
      height: 1px;
      border: 0;
    }

    @media (min-width: 700px) {
      #app {
        max-width: 760px;
        margin: 0 auto;
      }

      .reactor {
        width: 250px;
        height: 250px;
      }

      .message-box {
        max-width: 650px;
      }
    }
  </style>
</head>

<body>
<div id="app">
  <div class="header">
    <div>
      <div class="brand-main">JARVIS</div>
      <div class="brand-sub">SERINA AI SYSTEM</div>
    </div>

    <div class="header-right">
      <div class="online-dot"></div>
      <div class="online-text" id="onlineText">BOOTING V3</div>
      <button class="settings-btn" type="button" onclick="toggleSettings()">⚙</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">OPEN ORDERS</div>
      <div class="stat-value" id="orderCount">--</div>
    </div>
    <div class="stat">
      <div class="stat-label">ACTIVE TABLES</div>
      <div class="stat-value" id="tableCount">--</div>
    </div>
    <div class="stat">
      <div class="stat-label">DEVICE</div>
      <div class="stat-value" id="deviceLabel">--</div>
    </div>
  </div>

  <div class="main">
    <div class="reactor" id="reactor">
      <div class="reactor-core"></div>
    </div>

    <div class="state-title" id="stateTitle">OFFLINE</div>
    <div class="state-sub" id="stateSub">SYSTEM STARTを押してください</div>
    <div class="message-box" id="messageBox"></div>
  </div>

  <div class="footer">
    <div class="clap-status">
      <span class="clap-dot"></span>
      <span id="clapLabel">CLAP × 2 TO ACTIVATE</span>
    </div>

    <div class="input-row">
      <button class="icon-btn" type="button" onclick="manualListen()">🎙</button>
      <input id="textInput" type="text" autocomplete="off" placeholder="JARVISに指示...">
      <button class="icon-btn send-btn" type="button" onclick="manualSend()">➤</button>
    </div>
  </div>
</div>

<div class="scanlines"></div>

<div class="start-overlay" id="startOverlay">
  <div class="start-panel">
    <div class="start-title">JARVIS</div>
    <div class="start-text">
      起動するとマイクを待機状態にします。<br>
      拍手2回で「はい」→ 音声命令を開始します。<br><br>
      初回だけGASで発行したペアリングトークンを保存してください。
    </div>

    <input
      class="pair-input"
      id="pairTokenInput"
      type="password"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="初回のみ：ペアリングトークン"
    >
    <div class="pair-hint" id="pairHint">未ペアリング</div>

    <button class="start-button" type="button" onclick="startSystem()">SYSTEM START</button>
  </div>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-title">SYSTEM SETTINGS</div>

  <div class="setting-block">
    <div class="setting-line">
      <span>拍手感度</span>
      <span id="sensitivityText">6</span>
    </div>
    <input id="sensitivity" type="range" min="1" max="10" value="6" oninput="changeSensitivity()">
  </div>

  <div class="setting-block">
    <div class="setting-line">
      <span>音声回答</span>
      <span id="voiceText">ON</span>
    </div>
    <button class="setting-button" type="button" onclick="toggleVoice()">音声回答 ON / OFF</button>
  </div>

  <div class="setting-block">
    <div class="setting-line">
      <span>端末ペアリング</span>
      <span id="pairStateText">未設定</span>
    </div>
    <div class="pair-status">トークンはこの端末内だけに保存され、GitHubには保存されません。</div>
    <button class="setting-button" type="button" onclick="changePairingToken()">ペアリングトークン変更</button>
  </div>

  <div class="setting-block">
    <button class="setting-button" type="button" onclick="loadBootstrap()">接続状態を更新</button>
    <button class="setting-button" type="button" onclick="toggleSettings()">閉じる</button>
  </div>
</div>

<iframe id="gasTransportFrame" name="gasTransportFrame" title="JARVIS Transport"></iframe>
<form id="gasTransportForm" method="post" target="gasTransportFrame" style="display:none"></form>

<script>
(function() {
  "use strict";

  var GAS_URL = "https://script.google.com/macros/s/AKfycbzi6xOnWBPx2xbSKkVL0JQSMg6nJzxct6-HlGe5PPuLh4vPX8tgfbiLkrdQsz4ucYeLCQ/exec";
  var TOKEN_STORAGE_KEY = "serinaJarvisPairingToken";
  var SENSITIVITY_STORAGE_KEY = "serinaJarvisSensitivity";

  var state = "offline";
  var busy = false;
  var voiceEnabled = true;
  var clapEnabled = true;
  var sensitivity = 6;
  var micReady = false;

  var deviceId = detectDeviceId();
  var deviceLabel = detectDeviceLabel();

  var micStream = null;
  var audioContext = null;
  var analyser = null;
  var audioData = null;
  var frequencyData = null;

  var clapHighpass = null;
  var clapAnalyser = null;
  var clapHighData = null;

  var monitorInterval = null;
  var noiseFloor = 0.018;
  var highNoiseFloor = 0.006;
  var firstClapAt = 0;
  var lastTransientAt = 0;
  var clapPulseStart = 0;
  var clapPulseMaxCrest = 0;
  var clapPulseMaxHighRatio = 0;

  var mediaRecorder = null;
  var recordedChunks = [];
  var recordingStartedAt = 0;
  var speechDetected = false;
  var silenceStartedAt = 0;
  var recordingStopRequested = false;

  var pendingRequests = {};

  var CLAP_MIN_GAP = 180;
  var CLAP_MAX_GAP = 820;
  var TRANSIENT_REFRACTORY = 120;
  var CLAP_MIN_PULSE_MS = 20;
  var CLAP_MAX_PULSE_MS = 165;
  var MAX_RECORD_MS = 8500;
  var NO_SPEECH_TIMEOUT_MS = 3200;
  var END_SILENCE_MS = 950;


  window.addEventListener("load", function() {
    document.getElementById("deviceLabel").textContent = deviceLabel;
    setupInput();
    setupTransportListener();

    var savedSensitivity = Number(localStorage.getItem(SENSITIVITY_STORAGE_KEY) || 0);
    if (savedSensitivity >= 1 && savedSensitivity <= 10) {
      sensitivity = savedSensitivity;
    }

    document.getElementById("sensitivity").value = sensitivity;
    document.getElementById("sensitivityText").textContent = String(sensitivity);

    updatePairingUi();

    if (getPairingToken()) {
      loadBootstrap();
    } else {
      document.getElementById("onlineText").textContent = "PAIRING NEEDED";
    }
  });


  function detectDeviceId() {
    var ua = navigator.userAgent || "";

    if (/iPhone/i.test(ua)) return "IPHONE_LEGACY";
    if (/Windows/i.test(ua)) return "WIN_MAIN";
    return "BROWSER_" + Math.random().toString(36).slice(2, 8).toUpperCase();
  }


  function detectDeviceLabel() {
    var ua = navigator.userAgent || "";

    if (/iPhone/i.test(ua)) return "iPhone";
    if (/Windows/i.test(ua)) return "Windows";
    return "Browser";
  }


  function getPairingToken() {
    return String(localStorage.getItem(TOKEN_STORAGE_KEY) || "").trim();
  }


  function savePairingToken(value) {
    var token = String(value || "").trim();

    if (!token) return false;

    localStorage.setItem(TOKEN_STORAGE_KEY, token);
    document.getElementById("pairTokenInput").value = "";
    updatePairingUi();
    return true;
  }


  function updatePairingUi() {
    var paired = !!getPairingToken();

    document.getElementById("pairHint").textContent =
      paired ? "この端末はペアリング済みです" : "未ペアリング";

    document.getElementById("pairStateText").textContent =
      paired ? "設定済み" : "未設定";

    document.getElementById("pairTokenInput").placeholder =
      paired ? "ペアリング済み（変更時だけ入力）" : "初回のみ：ペアリングトークン";
  }


  window.startSystem = function() {
    var typedToken = document.getElementById("pairTokenInput").value;

    if (typedToken) {
      savePairingToken(typedToken);
    }

    if (!getPairingToken()) {
      setState("error", "PAIRING REQUIRED", "ペアリングトークンを入力してください");
      document.getElementById("pairHint").textContent = "GASで発行したトークンが必要です";
      return;
    }

    setState("processing", "STARTING", "マイクを初期化しています...");
    unlockSpeech();

    startAudioMonitor(function(ok, message) {
      if (!ok) {
        setState("error", "MIC ERROR", message || "マイクを開始できません。");
        return;
      }

      micReady = true;
      document.getElementById("startOverlay").style.display = "none";

      setState(
        "standby",
        "STANDBY",
        clapEnabled
          ? "拍手を2回すると音声入力を開始します"
          : "マイクボタンから音声入力できます"
      );

      loadBootstrap();
    });
  };


  function startAudioMonitor(done) {
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
      done(false, "このブラウザではマイクを利用できません。");
      return;
    }

    navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: false,
        autoGainControl: false
      },
      video: false
    }).then(function(stream) {
      micStream = stream;

      var AC = window.AudioContext || window.webkitAudioContext;

      if (!AC) {
        done(false, "AudioContextに対応していません。");
        return;
      }

      audioContext = new AC();

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      var source = audioContext.createMediaStreamSource(stream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 1024;
      analyser.smoothingTimeConstant = 0.15;
      source.connect(analyser);

      // 拍手専用：人の声の主成分を落として高域の衝撃音を見る
      clapHighpass = audioContext.createBiquadFilter();
      clapHighpass.type = "highpass";
      clapHighpass.frequency.value = 1800;
      clapHighpass.Q.value = 0.7;

      clapAnalyser = audioContext.createAnalyser();
      clapAnalyser.fftSize = 1024;
      clapAnalyser.smoothingTimeConstant = 0.05;

      source.connect(clapHighpass);
      clapHighpass.connect(clapAnalyser);

      audioData = new Uint8Array(analyser.fftSize);
      frequencyData = new Uint8Array(analyser.frequencyBinCount);
      clapHighData = new Uint8Array(clapAnalyser.fftSize);

      if (monitorInterval) clearInterval(monitorInterval);
      monitorInterval = setInterval(sampleAudio, 20);

      done(true);
    }).catch(function(err) {
      done(
        false,
        "マイク権限を確認してください。 " +
        (err && err.message ? err.message : "")
      );
    });
  }


  function readAudioMetrics() {
    if (!analyser || !audioData) {
      return {
        rms: 0,
        peak: 0,
        crest: 0,
        highRms: 0,
        highPeak: 0,
        highRatio: 0
      };
    }

    analyser.getByteTimeDomainData(audioData);

    var sum = 0;
    var peak = 0;

    for (var i = 0; i < audioData.length; i++) {
      var v = (audioData[i] - 128) / 128;
      var abs = Math.abs(v);

      sum += v * v;
      if (abs > peak) peak = abs;
    }

    var rms = Math.sqrt(sum / audioData.length);

    var highRms = 0;
    var highPeak = 0;

    if (clapAnalyser && clapHighData) {
      clapAnalyser.getByteTimeDomainData(clapHighData);

      var highSum = 0;

      for (var j = 0; j < clapHighData.length; j++) {
        var hv = (clapHighData[j] - 128) / 128;
        var habs = Math.abs(hv);

        highSum += hv * hv;
        if (habs > highPeak) highPeak = habs;
      }

      highRms =
        Math.sqrt(highSum / clapHighData.length);
    }

    return {
      rms: rms,
      peak: peak,
      crest: peak / Math.max(rms, 0.005),
      highRms: highRms,
      highPeak: highPeak,
      highRatio: highRms / Math.max(rms, 0.006)
    };
  }


  function sampleAudio() {
    if (!analyser || !audioData) return;

    var metrics = readAudioMetrics();

    if (state === "standby" && clapEnabled) {
      detectClap(metrics);
      return;
    }

    if (
      state === "listening" &&
      mediaRecorder &&
      mediaRecorder.state === "recording"
    ) {
      monitorVoiceRecording(metrics);
    }
  }


  function detectClap(metrics) {
    var rms = metrics.rms;
    var peak = metrics.peak;
    var highRms = metrics.highRms || 0;
    var highPeak = metrics.highPeak || 0;
    var highRatio = metrics.highRatio || 0;
    var now = Date.now();

    // 感度1〜10。高いほど必要レベルを少し下げる。
    var rawPeakThreshold =
      Math.max(
        0.12,
        0.30 - sensitivity * 0.014,
        noiseFloor * 3.0
      );

    var highRmsThreshold =
      Math.max(
        0.010,
        0.024 - sensitivity * 0.0012,
        highNoiseFloor * (4.6 - sensitivity * 0.12)
      );

    var highPeakThreshold =
      Math.max(
        0.055,
        0.12 - sensitivity * 0.006,
        highNoiseFloor * 8.0
      );

    var ratioThreshold =
      Math.max(
        0.16,
        0.30 - sensitivity * 0.012
      );

    var attack =
      peak >= rawPeakThreshold &&
      highRms >= highRmsThreshold &&
      highPeak >= highPeakThreshold &&
      highRatio >= ratioThreshold &&
      now - lastTransientAt >
        TRANSIENT_REFRACTORY;

    if (!clapPulseStart) {
      if (attack) {
        clapPulseStart = now;
        clapPulseMaxCrest = highPeak;
        clapPulseMaxHighRatio = highRatio;
        return;
      }

      // 静かな時だけ環境ノイズを学習
      if (rms < 0.07) {
        noiseFloor =
          noiseFloor * 0.985 + rms * 0.015;

        noiseFloor =
          Math.max(
            0.006,
            Math.min(noiseFloor, 0.10)
          );
      }

      if (highRms < 0.035) {
        highNoiseFloor =
          highNoiseFloor * 0.985 +
          highRms * 0.015;

        highNoiseFloor =
          Math.max(
            0.002,
            Math.min(highNoiseFloor, 0.035)
          );
      }

      return;
    }

    clapPulseMaxCrest =
      Math.max(clapPulseMaxCrest, highPeak);

    clapPulseMaxHighRatio =
      Math.max(
        clapPulseMaxHighRatio,
        highRatio
      );

    var duration = now - clapPulseStart;

    var released =
      highRms <=
      Math.max(
        highNoiseFloor * 1.8,
        highRmsThreshold * 0.48
      );

    // 拍手は短い高域パルス。
    // 声の子音は高域があっても長く続くので棄却する。
    if (released) {
      if (
        duration >= 10 &&
        duration <= 180 &&
        clapPulseMaxCrest >= highPeakThreshold &&
        clapPulseMaxHighRatio >= ratioThreshold
      ) {
        var clapAt = clapPulseStart;

        lastTransientAt = now;
        resetClapPulse_();
        registerClap(clapAt);
        return;
      }

      resetClapPulse_();
      return;
    }

    if (duration > 180) {
      resetClapPulse_();
    }
  }


  function resetClapPulse_() {
    clapPulseStart = 0;
    clapPulseMaxCrest = 0;
    clapPulseMaxHighRatio = 0;
  }


  function registerClap(now) {
    if (!firstClapAt) {
      firstClapAt = now;
      flashClap("CLAP 1 / 2");
      return;
    }

    var gap = now - firstClapAt;

    if (gap >= CLAP_MIN_GAP && gap <= CLAP_MAX_GAP) {
      firstClapAt = 0;
      activateByClap();
      return;
    }

    if (gap > CLAP_MAX_GAP) {
      firstClapAt = now;
      flashClap("CLAP 1 / 2");
    }
  }


  function flashClap(text) {
    document.getElementById("clapLabel").textContent = text;

    setTimeout(function() {
      if (state === "standby") {
        document.getElementById("clapLabel").textContent = "CLAP × 2 TO ACTIVATE";
      }
    }, 650);
  }


  function activateByClap() {
    if (busy || state !== "standby") return;

    setState("listening", "ACTIVATED", "はい。ご用件をどうぞ。");
    playActivateTone();

    speakShort("はい", function() {
      setTimeout(beginVoiceRecording, 140);
    });
  }


  window.manualListen = function() {
    if (busy) return;

    if (state === "offline") {
      alert("先にSYSTEM STARTを押してください。");
      return;
    }

    if (!micReady) {
      setState("error", "MIC ERROR", "マイクが起動していません。");
      setTimeout(returnToStandby, 1600);
      return;
    }

    setState("listening", "LISTENING", "ご用件をどうぞ");
    beginVoiceRecording();
  };


  function chooseRecordingMimeType() {
    if (!window.MediaRecorder) return "";

    var list = [
      "audio/mp4",
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/ogg;codecs=opus"
    ];

    for (var i = 0; i < list.length; i++) {
      try {
        if (
          !MediaRecorder.isTypeSupported ||
          MediaRecorder.isTypeSupported(list[i])
        ) {
          return list[i];
        }
      } catch (ignore) {}
    }

    return "";
  }


  function beginVoiceRecording() {
    if (!micStream) {
      returnToStandby("マイクが利用できません");
      return;
    }

    if (!window.MediaRecorder) {
      setState("error", "VOICE UNSUPPORTED", "この端末は音声録音に対応していません。");
      setTimeout(returnToStandby, 1900);
      return;
    }

    if (mediaRecorder && mediaRecorder.state === "recording") {
      return;
    }

    recordedChunks = [];
    recordingStartedAt = Date.now();
    speechDetected = false;
    silenceStartedAt = 0;
    recordingStopRequested = false;

    var mimeType = chooseRecordingMimeType();

    try {
      mediaRecorder = mimeType
        ? new MediaRecorder(micStream, {
            mimeType: mimeType,
            audioBitsPerSecond: 64000
          })
        : new MediaRecorder(micStream);
    } catch (err) {
      try {
        mediaRecorder = new MediaRecorder(micStream);
      } catch (err2) {
        setState("error", "RECORDER ERROR", "音声録音を開始できません。");
        setTimeout(returnToStandby, 1800);
        return;
      }
    }

    mediaRecorder.ondataavailable = function(event) {
      if (event.data && event.data.size > 0) {
        recordedChunks.push(event.data);
      }
    };

    mediaRecorder.onerror = function() {
      recordingStopRequested = true;
      setState("error", "RECORDER ERROR", "音声録音中にエラーが発生しました。");
      setTimeout(returnToStandby, 1800);
    };

    mediaRecorder.onstop = function() {
      var actualMime =
        mediaRecorder && mediaRecorder.mimeType
          ? mediaRecorder.mimeType
          : (mimeType || "audio/mp4");

      if (!recordedChunks.length) {
        busy = false;
        returnToStandby("音声を聞き取れませんでした");
        return;
      }

      var blob = new Blob(recordedChunks, { type: actualMime });
      sendAudioBlob(blob, actualMime);
    };

    try {
      mediaRecorder.start(250);
      setState("listening", "LISTENING", "ご用件をどうぞ");
      showMessage("");
    } catch (startErr) {
      setState("error", "RECORDER ERROR", "音声録音を開始できません。");
      setTimeout(returnToStandby, 1800);
    }
  }


  function monitorVoiceRecording(metrics) {
    var now = Date.now();
    var elapsed = now - recordingStartedAt;
    var voiceThreshold = Math.max(0.028, noiseFloor * 1.65);

    if (metrics.rms >= voiceThreshold) {
      speechDetected = true;
      silenceStartedAt = 0;
    } else if (speechDetected && elapsed > 650) {
      if (!silenceStartedAt) silenceStartedAt = now;

      if (now - silenceStartedAt >= END_SILENCE_MS) {
        stopVoiceRecording();
        return;
      }
    }

    if (!speechDetected && elapsed >= NO_SPEECH_TIMEOUT_MS) {
      stopVoiceRecording();
      return;
    }

    if (elapsed >= MAX_RECORD_MS) {
      stopVoiceRecording();
    }
  }


  function stopVoiceRecording() {
    if (
      recordingStopRequested ||
      !mediaRecorder ||
      mediaRecorder.state !== "recording"
    ) {
      return;
    }

    recordingStopRequested = true;

    try {
      mediaRecorder.stop();
    } catch (ignore) {}
  }


  function sendAudioBlob(blob, mimeType) {
    busy = true;
    setState("processing", "PROCESSING", "録音完了。GASへ送信しています...");

    var reader = new FileReader();

    reader.onloadend = function() {
      var dataUrl = String(reader.result || "");
      var comma = dataUrl.indexOf(",");
      var base64 = comma >= 0 ? dataUrl.substring(comma + 1) : "";

      if (!base64) {
        busy = false;
        handleResult({
          success: false,
          message: "音声データを読み取れませんでした。"
        });
        return;
      }

      apiRequest(
        "audio",
        {
          audioBase64: base64,
          mimeType: mimeType || blob.type || "audio/mp4",
          deviceId: deviceId
        },
        function(result) {
          busy = false;
          handleResult(result);
        },
        35000
      );
    };

    reader.onerror = function() {
      busy = false;
      handleResult({
        success: false,
        message: "音声データの読み込みに失敗しました。"
      });
    };

    reader.readAsDataURL(blob);
  }


  window.manualSend = function() {
    var input = document.getElementById("textInput");
    var text = String(input.value || "").trim();

    if (!text || busy) return;

    input.value = "";
    sendCommand(text, "TEXT");
  };


  function setupInput() {
    document.getElementById("textInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.isComposing) {
        event.preventDefault();
        window.manualSend();
      }
    });
  }


  function sendCommand(text, inputType) {
    if (!text || busy) return;

    busy = true;
    showMessage(text);
    setState("processing", "PROCESSING", "指示を処理しています...");

    apiRequest(
      "command",
      {
        text: text,
        deviceId: deviceId,
        inputType: inputType || "TEXT"
      },
      function(result) {
        busy = false;
        handleResult(result);
      },
      30000
    );
  }


  function handleResult(result) {
    result = result || {};

    var ok = result.success === true;
    var message = String(result.message || "応答を取得できませんでした。");
    var transcript = String(result.normalizedTranscript || result.transcript || "").trim();

    if (transcript) {
      showMessage("認識：" + transcript + "\n\n" + message);
    } else {
      showMessage(message);
    }

    if (ok) {
      setState(
        "complete",
        "COMPLETE",
        result.mode === "fast" ? "FAST COMMAND" : "JARVIS RESPONSE"
      );
    } else {
      setState("error", "ERROR", "処理を確認してください");
    }

    if (result.refreshStats) {
      setTimeout(loadBootstrap, 250);
    }

    if (voiceEnabled && (result.speak || message)) {
      speak(String(result.speak || message), function() {
        setTimeout(returnToStandby, 260);
      });
    } else {
      setTimeout(returnToStandby, 1100);
    }
  }


  function setupTransportListener() {
    // v2ではiframeからpostMessageを受けない。
    // POST結果はGASの一時キャッシュへ保存し、JSONPで取得する。
  }


  function apiRequest(action, data, callback, timeoutMs) {
    var token = getPairingToken();

    if (!token) {
      callback({
        success: false,
        message: "ペアリングトークンが未設定です。"
      });
      return;
    }

    var requestId = makeSecureRequestId_();

    var params =
      new URLSearchParams();

    params.set("token", token);
    params.set("requestId", requestId);
    params.set("action", action);

    data = data || {};

    Object.keys(data).forEach(function(key) {
      params.set(
        key,
        data[key] == null
          ? ""
          : String(data[key])
      );
    });

    // クロスオリジンのためレスポンス本文は読まない。
    // POSTだけ送り、結果はJSONPポーリングで取得する。
    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      cache: "no-store",
      headers: {
        "Content-Type":
          "application/x-www-form-urlencoded;charset=UTF-8"
      },
      body: params.toString()
    }).then(function() {
      if (action === "audio") {
        setState(
          "processing",
          "PROCESSING",
          "GASで音声を処理しています..."
        );
      }

      pollRequestResult_(
        requestId,
        callback,
        Number(timeoutMs || 30000)
      );

    }).catch(function() {
      callback({
        success: false,
        message:
          "JARVIS GASへPOST送信できませんでした。"
      });
    });
  }


  function makeSecureRequestId_() {
    var bytes = new Uint8Array(16);

    if (
      window.crypto &&
      window.crypto.getRandomValues
    ) {
      window.crypto.getRandomValues(bytes);

      var hex = "";

      for (var i = 0; i < bytes.length; i++) {
        hex +=
          ("0" + bytes[i].toString(16)).slice(-2);
      }

      return "j" + hex;
    }

    // 古いブラウザ用フォールバック
    return (
      "j" +
      Date.now().toString(36) +
      Math.random().toString(36).slice(2, 14) +
      Math.random().toString(36).slice(2, 14)
    ).replace(/[^A-Za-z0-9_-]/g, "");
  }


  function pollRequestResult_(
    requestId,
    callback,
    timeoutMs
  ) {
    var startedAt = Date.now();
    var finished = false;

    function finish(result) {
      if (finished) return;
      finished = true;
      callback(result);
    }

    var pollCount = 0;

    function poll() {
      if (finished) return;

      pollCount++;

      if (state === "processing") {
        document.getElementById("stateSub").textContent =
          "GAS応答待ち... " + pollCount;
      }

      if (Date.now() - startedAt > timeoutMs) {
        finish({
          success: false,
          message:
            "JARVIS GASとの通信がタイムアウトしました。"
        });
        return;
      }

      var callbackName =
        "__jarvisPoll_" +
        requestId.replace(/[^A-Za-z0-9_$]/g, "");

      var script =
        document.createElement("script");

      var cleaned = false;

      function cleanup() {
        if (cleaned) return;
        cleaned = true;

        try {
          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        } catch (ignore) {}

        try {
          delete window[callbackName];
        } catch (ignore2) {
          window[callbackName] = undefined;
        }
      }

      window[callbackName] = function(packet) {
        packet = packet || {};
        cleanup();

        if (packet.ready === true) {
          finish(
            packet.result || {
              success: false,
              message:
                "GASから空の応答が返りました。"
            }
          );
          return;
        }

        setTimeout(poll, 550);
      };

      script.onerror = function() {
        cleanup();
        setTimeout(poll, 850);
      };

      script.async = true;
      script.src =
        GAS_URL +
        "?api=poll" +
        "&requestId=" +
        encodeURIComponent(requestId) +
        "&callback=" +
        encodeURIComponent(callbackName) +
        "&_=" +
        Date.now();

      document.head.appendChild(script);
    }

    // POST処理が開始するまで少し待つ
    setTimeout(poll, 450);
  }


  function appendHidden(form, name, value) {
    var input = document.createElement("input");
    input.type = "hidden";
    input.name = name;
    input.value = value == null ? "" : String(value);
    form.appendChild(input);
  }


  window.loadBootstrap = loadBootstrap;

  function loadBootstrap() {
    if (!getPairingToken()) {
      document.getElementById("onlineText").textContent = "PAIRING NEEDED";
      return;
    }

    apiRequest(
      "bootstrap",
      { deviceId: deviceId },
      function(data) {
        if (!data || data.success !== true) {
          document.getElementById("onlineText").textContent = "API OFFLINE";
          return;
        }

        voiceEnabled = data.voiceReplyEnabled !== false;
        clapEnabled = data.clapEnabled !== false;

        // 端末側で感度を変更済みならローカル設定を優先
        if (!localStorage.getItem(SENSITIVITY_STORAGE_KEY)) {
          sensitivity = Number(data.clapSensitivity || 6);
          document.getElementById("sensitivity").value = sensitivity;
          document.getElementById("sensitivityText").textContent = String(sensitivity);
        }

        document.getElementById("voiceText").textContent =
          voiceEnabled ? "ON" : "OFF";

        document.getElementById("onlineText").textContent =
          data.apiReady ? "SYSTEM ONLINE V3" : "API KEY NEEDED";

        var summary = data.orderSummary || {};

        document.getElementById("orderCount").textContent =
          summary.connected ? String(summary.openOrderCount || 0) : "--";

        document.getElementById("tableCount").textContent =
          summary.connected ? String(summary.activeTableCount || 0) : "--";
      },
      25000
    );
  }


  function setState(newState, title, sub) {
    state = newState;

    var reactor = document.getElementById("reactor");
    reactor.className = "reactor";

    if (newState !== "standby" && newState !== "offline") {
      reactor.className += " " + newState;
    }

    document.getElementById("stateTitle").textContent =
      title || newState.toUpperCase();

    document.getElementById("stateSub").textContent =
      sub || "";

    if (newState === "standby") {
      document.getElementById("clapLabel").textContent =
        clapEnabled ? "CLAP × 2 TO ACTIVATE" : "VOICE BUTTON READY";
    }
  }


  function returnToStandby(subText) {
    if (state === "offline") return;

    setState(
      "standby",
      "STANDBY",
      subText ||
        (clapEnabled
          ? "拍手を2回すると音声入力を開始します"
          : "マイクボタンから音声入力できます")
    );

    setTimeout(function() {
      if (state === "standby") {
        document.getElementById("stateSub").textContent =
          clapEnabled
            ? "拍手を2回すると音声入力を開始します"
            : "マイクボタンから音声入力できます";
      }
    }, 1400);
  }


  function showMessage(text) {
    var box = document.getElementById("messageBox");

    if (!text) {
      box.style.display = "none";
      box.textContent = "";
      return;
    }

    box.style.display = "block";
    box.textContent = text;
    box.scrollTop = box.scrollHeight;
  }


  function speak(text, done) {
    if (!("speechSynthesis" in window) || !text) {
      if (done) done();
      return;
    }

    window.speechSynthesis.cancel();

    var utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "ja-JP";
    utterance.rate = 1.05;
    utterance.pitch = 0.92;
    utterance.volume = 1;

    var finished = false;

    function finish() {
      if (finished) return;
      finished = true;
      if (done) done();
    }

    utterance.onend = finish;
    utterance.onerror = finish;

    window.speechSynthesis.speak(utterance);
    setTimeout(finish, Math.min(9000, 1200 + text.length * 95));
  }


  function speakShort(text, done) {
    if (!("speechSynthesis" in window) || !text) {
      if (done) done();
      return;
    }

    window.speechSynthesis.cancel();

    var utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "ja-JP";
    utterance.rate = 1.1;
    utterance.pitch = 0.9;
    utterance.volume = 1;

    var finished = false;

    function finish() {
      if (finished) return;
      finished = true;
      if (done) done();
    }

    utterance.onend = finish;
    utterance.onerror = finish;

    window.speechSynthesis.speak(utterance);
    setTimeout(finish, 900);
  }


  function unlockSpeech() {
    if (!("speechSynthesis" in window)) return;

    try {
      var u = new SpeechSynthesisUtterance(" ");
      u.volume = 0.01;
      window.speechSynthesis.speak(u);
    } catch (ignore) {}
  }


  function playActivateTone() {
    if (!audioContext) return;

    try {
      var osc = audioContext.createOscillator();
      var gain = audioContext.createGain();

      osc.frequency.value = 880;
      gain.gain.value = 0.025;

      osc.connect(gain);
      gain.connect(audioContext.destination);
      osc.start();

      setTimeout(function() {
        try { osc.stop(); } catch (ignore) {}
      }, 80);
    } catch (ignore2) {}
  }


  window.toggleSettings = function() {
    var panel = document.getElementById("settingsPanel");

    panel.className =
      panel.className.indexOf(" open") >= 0
        ? "settings-panel"
        : "settings-panel open";
  };


  window.changeSensitivity = function() {
    sensitivity = Number(
      document.getElementById("sensitivity").value || 6
    );

    localStorage.setItem(
      SENSITIVITY_STORAGE_KEY,
      String(sensitivity)
    );

    document.getElementById("sensitivityText").textContent =
      String(sensitivity);
  };


  window.toggleVoice = function() {
    voiceEnabled = !voiceEnabled;

    document.getElementById("voiceText").textContent =
      voiceEnabled ? "ON" : "OFF";

    if (!voiceEnabled && "speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
  };


  window.changePairingToken = function() {
    var next = window.prompt(
      "新しいJARVISペアリングトークンを入力してください。"
    );

    if (!next) return;

    savePairingToken(next);
    loadBootstrap();
  };

})();
</script>
