<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#02070b">
  <title>JARVIS // LATEST BUILD LOADER</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02070b;color:#b8f6ff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
    body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,rgba(20,132,164,.28),rgba(2,7,11,.98) 58%)}
    .shell{width:min(86vw,390px);text-align:center}
    .brand{font-size:31px;font-weight:300;letter-spacing:10px;text-shadow:0 0 22px rgba(84,225,255,.6)}
    .reactor{position:relative;width:150px;height:150px;margin:28px auto 24px;border-radius:50%}
    .ring{position:absolute;border-radius:50%;border:1px solid rgba(84,225,255,.25)}
    .r1{inset:0;border-top-color:#9bf3ff;animation:spin 3.8s linear infinite}
    .r2{inset:18px;border-right-color:#67e7ff;animation:spinReverse 2.5s linear infinite}
    .r3{inset:39px;animation:pulse 1.3s ease-in-out infinite}
    .core{position:absolute;inset:57px;border-radius:50%;background:radial-gradient(circle,#f2ffff 0,#70eaff 28%,#116b85 67%);box-shadow:0 0 24px rgba(91,228,255,.9)}
    .status{font-size:12px;letter-spacing:2.2px;color:#7295a0}
    .detail{min-height:18px;margin-top:10px;font-size:11px;color:#52717c}
    .retry{display:none;width:100%;height:48px;margin-top:22px;border:1px solid rgba(100,229,255,.38);border-radius:13px;background:#0b4356;color:#c7f8ff;font-size:14px;letter-spacing:1px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes spinReverse{to{transform:rotate(-360deg)}}
    @keyframes pulse{50%{transform:scale(1.08);opacity:.55}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">JARVIS</div>
    <div class="reactor"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div></div>
    <div class="status" id="status">VERIFYING LATEST BUILD</div>
    <div class="detail" id="detail">最新版を安全に取得しています</div>
    <button class="retry" id="retry" type="button" onclick="location.reload()">再読み込み</button>
  </div>
  <script>
    (function(){
      "use strict";
      var stamp = Date.now();
      var manifestUrl = "./version.json?__t=" + stamp;

      function fail(message) {
        document.getElementById("status").textContent = "UPDATE CHECK FAILED";
        document.getElementById("detail").textContent = message || "通信を確認して再読み込みしてください";
        document.getElementById("retry").style.display = "block";
      }

      fetch(manifestUrl, {cache:"no-store", credentials:"same-origin"})
        .then(function(response){
          if (!response.ok) throw new Error("version.json: " + response.status);
          return response.json();
        })
        .then(function(manifest){
          var version = String(manifest && manifest.version || "").trim();
          var entry = String(manifest && manifest.entry || "").trim();
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("invalid version");
          if (!/^[A-Za-z0-9._-]+\.html$/.test(entry)) throw new Error("invalid entry");

          document.getElementById("status").textContent = "LOADING BUILD " + version;
          document.getElementById("detail").textContent = "JARVIS本体を展開しています";

          return fetch("./" + entry + "?__jarvis=" + encodeURIComponent(version) + "&__t=" + Date.now(), {
            cache:"no-store",
            credentials:"same-origin"
          }).then(function(response){
            if (!response.ok) throw new Error(entry + ": " + response.status);
            return response.text().then(function(html){
              return {html:html, version:version};
            });
          });
        })
        .then(function(result){
          try {
            history.replaceState(null, "", window.location.pathname + "?__jarvis=" + encodeURIComponent(result.version) + "&__t=" + Date.now());
          } catch (ignore) {}
          document.open();
          document.write(result.html);
          document.close();
        })
        .catch(function(error){
          fail("最新版を取得できませんでした：" + String(error && error.message || error));
        });
    })();
  </script>
</body>
</html>
